version: 2

models:
  - name: stg_activities
    description: "One row per Garmin activity with cleaned, typed columns."
    columns:
      - name: activity_id
        tests:
          - unique
          - not_null
      - name: activity_type
        tests:
          - not_null
      - name: started_at
        tests:
          - not_null

  - name: stg_daily_stats
    description: "One row per day, summary of overall daily activity and physiology."
    columns:
      - name: stat_date
        tests:
          - unique
          - not_null